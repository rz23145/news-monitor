[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-monitor"
version = "1.0.0"
description = "Real-Time Financial News Monitoring System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp",
  "feedparser",
  "python-dateutil",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
